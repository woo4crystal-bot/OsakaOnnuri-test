<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<title>오늘의 성경암송 | 今日の暗唱聖句</title>

<style>
:root{
  --bg-1:#0b1020; --bg-2:#0a1630; --text:#eef2ff;
  --muted:rgba(238,242,255,.72); --accent:#7c3aed; --accent2:#06b6d4;
  --gold:#f6c453; --border:rgba(255,255,255,.14); --radius:22px;
  --shadow:0 18px 40px rgba(0,0,0,.35); --shadow2:0 10px 26px rgba(0,0,0,.24);
  --glass:blur(12px);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Noto Sans JP",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 15% 0%, rgba(124,58,237,.45), transparent 60%),
    radial-gradient(900px 520px at 90% 10%, rgba(6,182,212,.35), transparent 55%),
    radial-gradient(700px 480px at 50% 100%, rgba(246,196,83,.18), transparent 62%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
}
.safe{ padding:max(18px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom)) 16px; }
.wrap{ max-width:820px; margin:auto; display:flex; flex-direction:column; gap:14px; }
header{ padding:26px 18px 14px 18px; border-bottom:1px solid rgba(255,255,255,.10); position:relative; }
header::after{ content:""; position:absolute; left:18px; right:18px; bottom:-1px; height:1px; background:linear-gradient(90deg, transparent, rgba(246,196,83,.55), transparent); opacity:.9; }
h1{ margin:0; font-size:19px; font-weight:950; letter-spacing:-.2px; background:linear-gradient(90deg, #ffffff, rgba(255,255,255,.92), rgba(6,182,212,.92)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub{ font-size:12.8px; color:var(--muted); margin-top:8px; line-height:1.5; }
.card{ background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.14); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; backdrop-filter:var(--glass); -webkit-backdrop-filter:var(--glass); position:relative; }
.cardPad{ padding:18px; position:relative; z-index:1; }
.badge{ display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; font-size:16px; font-weight:950; color:rgba(255,255,255,.92); background:linear-gradient(90deg, rgba(124,58,237,.55), rgba(6,182,212,.35)); border:1px solid rgba(255,255,255,.18); box-shadow:var(--shadow2); }
.title{ margin-top:12px; font-size:19px; font-weight:950; color:rgba(95,251,241,.88); text-shadow:0 1px 2px rgba(0,0,0,.55); letter-spacing:-.2px; line-height:1.25; }
.meta{ font-size:12.7px; color:var(--muted); margin-top:6px; }
.sectionTitleRow{ margin-top:18px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sectionTitle{ font-size:14px; font-weight:950; color:rgba(255,255,255,.88); margin:0; letter-spacing:.55px; position:relative; padding-left:12px; }
.sectionTitle::before{ content:""; position:absolute; left:0; top:50%; width:6px; height:6px; border-radius:50%; background:linear-gradient(180deg, var(--gold), rgba(246,196,83,.35)); transform:translateY(-50%); box-shadow:0 0 0 4px rgba(246,196,83,.10); }
.verseBox{ margin-top:10px; padding:18px; border-radius:18px; background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.16); font-size:19px; font-weight:900; line-height:1.85; color:rgba(249,248,113,.96); white-space:pre-wrap; }
.explainBox{ margin-top:10px; padding:16px 18px; border-radius:18px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); font-size:17px; line-height:1.7; color:rgba(255,255,255,.88); white-space:pre-wrap; }
.controls{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:520px){ .controls{grid-template-columns:1fr;} }
label{ font-size:14px; color:var(--muted); display:block; margin-bottom:6px; font-weight:950; }
input[type="date"]{ width:100%; padding:12px; border-radius:16px; border:1px solid rgba(255,255,255,.18); background:rgba(10,22,48,.55); color:#fff; outline:none; }
button{ padding:12px 14px; border-radius:16px; border:1px solid rgba(255,255,255,.18); background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#fff; font-size:14px; font-weight:950; cursor:pointer; transition: transform .1s; }
button:active{ transform: scale(0.98); }
button.secondary{ background: rgba(255,255,255,.1); }
button.rec{ background: linear-gradient(135deg, #ef4444, #991b1b); }
.miniBtn{ padding:8px 12px; border-radius:12px; font-size:12px; }
.status{ margin-top:12px; font-size:12.8px; color:var(--muted); min-height:1.5em; }
.langRow{ display:flex; justify-content:flex-end; gap:8px; padding:0 18px 8px 18px; }
.langBtn{ padding:6px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.16); background:rgba(10,22,48,.38); color:#fff; font-size:12px; }
.langBtn.active{ border-color:var(--gold); color:var(--gold); }
audio{ width: 100%; margin-top: 10px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
.recContainer{ display: flex; flex-direction: column; gap: 10px; align-items: center; }
</style>
</head>

<body>
<div class="safe">
  <div class="wrap">
    <header>
      <h1 id="hdrTitle">오늘의 성경암송</h1>
      <div class="sub" id="hdrSub">로딩 중...</div>
    </header>

    <div class="langRow">
      <button id="btnKo" class="langBtn" type="button">한국어</button>
      <button id="btnJa" class="langBtn" type="button">日本語</button>
    </div>

    <div class="card">
      <div class="cardPad" id="resultArea"></div>
    </div>

    <div class="card">
      <div class="cardPad">
        <div class="sectionTitleRow">
          <div class="sectionTitle" id="secRec">나의 암송 녹음</div>
        </div>
        <div class="explainBox recContainer">
          <div id="recStatus" style="font-size:13px; font-weight:bold; color:var(--gold);">Ready</div>
          <div style="display:flex; gap:10px; width:100%;">
            <button id="btnStartRec" style="flex:1;">녹음 시작</button>
            <button id="btnStopRec" style="flex:1;" class="secondary" disabled>중지</button>
          </div>
          <audio id="audioPlayback" controls></audio>
          <button id="btnDownloadRec" class="miniBtn secondary" style="width:100%; display:none;">녹음 파일 저장 (Download)</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="cardPad">
        <div class="controls">
          <div><label id="lblStart">시작일</label><input id="startDate" type="date"/></div>
          <div><label id="lblTarget">조회일</label><input id="targetDate" type="date"/></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:12px;">
          <button id="btnToday" class="secondary">오늘</button>
          <div style="display:flex; gap:8px;">
            <button id="btnPrev" class="secondary">이전</button>
            <button id="btnNext" class="secondary">다음</button>
          </div>
        </div>
        <div class="status" id="statusBox"></div>
      </div>
    </div>
  </div>
</div>

<script>
let VERSES = [];
let LANG = "ko";
const DEFAULT_START = "2026-02-08";
const STORAGE_START = "memorization_start_v4";
const STORAGE_LANG = "memorization_lang_v1";

const startInput = document.getElementById("startDate");
const targetInput = document.getElementById("targetDate");
const resultArea = document.getElementById("resultArea");
const statusBox = document.getElementById("statusBox");

// I18N 데이터
const I18N = {
  ko: {
    headerTitle: "오늘의 성경암송【오사카온누리교회】",
    headerSub: "매일 새로운 구절을 암송해보세요.",
    startLabel: "시작일 (암송1)", targetLabel: "조회 날짜",
    todayBtn: "오늘", prevBtn: "이전", nextBtn: "다음",
    secRec: "나의 암송 녹음", recReady: "준비됨", recIng: "🔴 녹음 중...", recDone: "✅ 녹음 완료",
    recStart: "녹음 시작", recStop: "녹음 중지", recSave: "파일 저장하기",
    sectionVerse: "[ 암송구절 ]", sectionExplain: "[ 해설 ]",
    badgeLine: (no, total) => `암송 ${no} / ${total}`,
    statusLine: (isToday, no, diff) => `${isToday ? "오늘 " : ""}암송 ${no} (${diff}일째)`
  },
  ja: {
    headerTitle: "今日の暗唱聖句【大阪オンヌリ教会】",
    headerSub: "毎日、御言葉を暗송しましょう。",
    startLabel: "開始일 (暗唱1)", targetLabel: "表示日",
    todayBtn: "今日", prevBtn: "前へ", nextBtn: "次へ",
    secRec: "ボイス録音", recReady: "準備完了", recIng: "🔴 録音中...", recDone: "✅ 録音完了",
    recStart: "録音開始", recStop: "停止", recSave: "録音を保存",
    sectionVerse: "【 暗唱聖句 】", sectionExplain: "【 解説 】",
    badgeLine: (no, total) => `暗唱聖句 ${no} / ${total}`,
    statusLine: (isToday, no, diff) => `${isToday ? "本日 " : ""}暗唱 ${no}（${diff}日目）`
  }
};

// --- 녹음 기능 로직 ---
let mediaRecorder;
let audioChunks = [];

async function startRecording() {
  const t = I18N[LANG];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    // 아이폰/안드로이드 호환 코덱 선택
    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const audioBlob = new Blob(audioChunks, { type: mimeType });
      const audioUrl = URL.createObjectURL(audioBlob);
      document.getElementById("audioPlayback").src = audioUrl;
      document.getElementById("btnDownloadRec").style.display = "block";
      document.getElementById("btnDownloadRec").onclick = () => {
        const a = document.createElement("a");
        a.href = audioUrl;
        a.download = `Rec_${new Date().getTime()}.${mimeType.split('/')[1]}`;
        a.click();
      };
    };

    mediaRecorder.start();
    document.getElementById("btnStartRec").disabled = true;
    document.getElementById("btnStopRec").disabled = false;
    document.getElementById("recStatus").textContent = t.recIng;
  } catch (err) {
    alert("마이크 권한이 필요합니다. (HTTPS 환경인지 확인해주세요)");
  }
}

function stopRecording() {
  const t = I18N[LANG];
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(track => track.stop());
  document.getElementById("btnStartRec").disabled = false;
  document.getElementById("btnStopRec").disabled = true;
  document.getElementById("recStatus").textContent = t.recDone;
}

document.getElementById("btnStartRec").onclick = startRecording;
document.getElementById("btnStopRec").onclick = stopRecording;

// --- 기존 앱 로직 ---
function toUtcDayNumber(str){
  const [y, m, d] = str.split("-").map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
}

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function applyLang(lang){
  LANG = lang;
  localStorage.setItem(STORAGE_LANG, LANG);
  const t = I18N[LANG];
  
  // UI 텍스트 업데이트
  document.getElementById("hdrTitle").textContent = t.headerTitle;
  document.getElementById("hdrSub").textContent = t.headerSub;
  document.getElementById("lblStart").textContent = t.startLabel;
  document.getElementById("lblTarget").textContent = t.targetLabel;
  document.getElementById("btnToday").textContent = t.todayBtn;
  document.getElementById("btnPrev").textContent = t.prevBtn;
  document.getElementById("btnNext").textContent = t.nextBtn;
  document.getElementById("secRec").textContent = t.secRec;
  document.getElementById("btnStartRec").textContent = t.recStart;
  document.getElementById("btnStopRec").textContent = t.recStop;
  document.getElementById("btnDownloadRec").textContent = t.recSave;
  document.getElementById("recStatus").textContent = t.recReady;
  
  document.getElementById("btnKo").classList.toggle("active", LANG === "ko");
  document.getElementById("btnJa").classList.toggle("active", LANG === "ja");

  await loadVerses();
  render();
}

async function loadVerses(){
  const file = LANG === "ja" ? "./verses-j.json" : "./verses.json";
  try{
    const res = await fetch(file, { cache: "no-store" });
    VERSES = await res.json();
    VERSES.sort((a, b) => (a.no ?? 0) - (b.no ?? 0));
  } catch(e) {
    resultArea.innerHTML = "<div class='cardPad'>데이터를 불러올 수 없습니다.</div>";
  }
}

function render(){
  const start = startInput.value;
  const target = targetInput.value;
  const t = I18N[LANG];
  if(!start || !target || !VERSES.length) return;

  const diff = toUtcDayNumber(target) - toUtcDayNumber(start);
  const no = diff + 1;
  
  if(no < 1 || no > VERSES.length){
    resultArea.innerHTML = `<div class='cardPad'>${no < 1 ? "시작 전입니다." : "범위를 벗어났습니다."}</div>`;
    return;
  }

  const v = VERSES[no - 1];
  resultArea.innerHTML = `
    <div class="badge">${t.badgeLine(v.no, VERSES.length)}</div>
    <div class="title">${v.ref} (${v.title})</div>
    <div class="meta">Day ${no}</div>
    <div class="sectionTitleRow"><div class="sectionTitle">${t.sectionVerse}</div></div>
    <div class="verseBox">${v.verse}</div>
    <div class="sectionTitleRow"><div class="sectionTitle">${t.sectionExplain}</div></div>
    <div class="explainBox">${v.explanation}</div>
  `;
  
  statusBox.textContent = t.statusLine(target === todayISO(), v.no, diff);
}

document.getElementById("btnKo").onclick = () => applyLang("ko");
document.getElementById("btnJa").onclick = () => applyLang("ja");
document.getElementById("btnToday").onclick = () => { targetInput.value = todayISO(); render(); };
document.getElementById("btnPrev").onclick = () => { targetInput.value = addDays(targetInput.value, -1); render(); };
document.getElementById("btnNext").onclick = () => { targetInput.value = addDays(targetInput.value, 1); render(); };

function addDays(iso, days){
  const d = new Date(toUtcDayNumber(iso) * 86400000 + (days * 86400000));
  return d.toISOString().split('T')[0];
}

startInput.onchange = render;
targetInput.onchange = render;

// 초기화
(async () => {
  const savedLang = localStorage.getItem(STORAGE_LANG) || (navigator.language.startsWith("ja") ? "ja" : "ko");
  startInput.value = localStorage.getItem(STORAGE_START) || DEFAULT_START;
  targetInput.value = todayISO();
  await applyLang(savedLang);
})();
</script>
</body>
</html>
